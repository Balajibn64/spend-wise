spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/spendwise}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only verifies the
      # entities match it at startup. Never let Hibernate write DDL itself.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${PORT:8080}

app:
  jwt:
    # No default: an unset secret must fail startup, not silently sign
    # tokens with a value that's sitting in git history.
    secret: ${JWT_SECRET}
    access-token-expiration: 900000      # 15 minutes
    refresh-token-expiration: 604800000  # 7 days

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
